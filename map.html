<!doctype html>
<html>
<head>
	<title>Police Route Safety Map</title>
	<link href="stylesheet.css" type="text/css" rel="stylesheet"/>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
	<header>
	<div class="container m-5">
		<div class="row mt-5">
			<div class="col-3">
                <form class="bg-body rounded p-3 shadow-lg" id="location-form" onsubmit="passOn(event);">
                    <div class="input-group">
                        <span class="input-group-text">Starting Point</span>
                        <input type="text" class="form-control rounded-right" id="startPoint" placeholder="Nottingham Trent University, NG11 8PT" name="startPoint" required>
                        <ul id="startPoint-suggestions" class="suggestions-list"></ul>
                    </div>

                    <div class="mb-3 input-group">
                        <span class="input-group-text">Destination&nbsp;&nbsp;&nbsp;&nbsp;</span>
                        <input type="text" class="form-control" id="destPoint" placeholder="London" name="destPoint" required>
                        <ul id="destPoint-suggestions" class="suggestions-list"></ul>
                    </div>
                    <div class="d-flex justify-content-center align-items-center">
                        <button type="submit" class="btn btn-primary mx-auto rounded-corners shadow-lg mb-3">Submit</button>
                    </div>
                </form> 
			</div>
            <div class="col-3">
            </div>
            <div class="col-3">
            </div>
            <div class="d-flex col-3">
                <div class="d-flex justify-content-center align-items-center flex-column w-100">
				    <div class="shadow-lg p-2 mb-3 bg-body rounded">  
                    <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Legend</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="border-end bg-danger">Red</td>
                            <td>Severe danger</td>
                        </tr>
                        <tr>
                            <td class="border-end bg-warning">Amber</td>
                            <td>Moderate danger</td>
                        </tr>
                        <tr>
                            <td class="border-end bg-success">Green</td>
                            <td>Safe to travel</td>
                        </tr>
                    </tbody>
                    </table>
                    </div>
                </div>
            </div>
		</div>
	</div>
	
	</header>
	
	<div id="bg-image" class="bg-image-unblurred"></div>
	</div>
	
	
	<div class="d-flex justify-content-center align-items-center">
		
	</div>
</body>
</html>
