<!doctype html>
<html>
<head>
	<title>Police Route Safety Map</title>
	<link href="css/stylesheet.css" type="text/css" rel="stylesheet" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
	<div id="startEnd">
		<form action="#" class="was-validated">
			<div class="mb-3 input-group">
				<span class="input-group-text">Starting Point</span>
				<input type="email" class="form-control" id="regEmail" placeholder="JohnDoe@anonmail.com" name="registerEmail" pattern="[a-z0-9._%+-]+@[a-z0-VT-9.-]+\.[a-z]{2,}$" required>
				<div class="valid-feedback">Done</div>
				<div class="invalid-feedback">Please fill out this field.</div>
				</div>
			<div class="mb-3 input-group">
				<span class="input-group-text">Destination</span>
				<input type="text" class="form-control" id="regFirstName" placeholder="John" name="registerFirstName" required>
				<div class="valid-feedback">Done</div>
				<div class="invalid-feedback">Please fill out this field.</div>
				</div>
			<button type="submit" class="btn btn-primary" onclick="validateForm(event)">Submit</button>
			
		</form> 
	</div>
</body>
</html>
