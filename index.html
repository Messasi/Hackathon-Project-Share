<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeScore</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
</head>
<body>
    
    <!-- Header Section -->
    <div class="input-section">
        <div class="input-group">
            <label for="location">Start Location</label>
            <input type="text" id="location" name="location" placeholder="e.g., New York City">
        <div>   
        <div class="input-group">
            <label for="destination">Destination</label>
            <input type="text" id="destination" name="destination" placeholder="e.g., Central Park">
        </div>
        <div>
            <ul id="suggestions"></ul>
        </div>
        <div>  
            <button id="getRouteBtn" onclick="onButtonClick()">Get Safe Route</button>
        </div>
    </div>






     <div id="map"></div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
 <script src="map.js"></script>   

</body>
</html>
