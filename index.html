<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeScore</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body id="map">
    <!-- Back button (top-left) - hidden until a route is shown -->
    <div class= "d-flex justify-content-center align-items-center col-1 vh-100" style="position:fixed; z-index: 999;">
        <button id="backBtn" class="btn btn-secondary rounded-circle" hidden onclick="onBackClick();">&#8592;</button>
    </div>
    
    <!-- Header Section -->
   

    <div class= "d-flex justify-content-center align-items-center mx-auto col-12 col-md-6 col-lg-4 vh-100" style="position:fixed; z-index: 999;"  id="startEnd">
        <div class="bg-body shadow-lg p-5 rounded">
            <form id="location-form" onsubmit="onButtonClick(event);">
                <div class="mb-3 input-group" style="position:relative;">
                    <span class="input-group-text">Starting Point</span>
                    <input type="text" class="form-control rounded-right" id="startPoint" placeholder="Nottingham Trent University, NG11 8PT" name="startPoint" required>
                    <ul id="startPoint-suggestions" class="suggestions-list"></ul>
                </div>
                <div class="mb-3 input-group" style="position:relative;">
                    <span class="input-group-text">Destination</span>
                    <input type="text" class="form-control" id="destPoint" placeholder="London" name="destPoint" required>
                    <ul id="destPoint-suggestions" class="suggestions-list"></ul>
                </div>
                <div>  
                    <div id="modeControls" class="mb-3">
                        <label class="form-label"><strong>Mode</strong></label>
                        <div class="mode-group">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="mode" value="drive" id="modeDriving" checked>
                                <label class="form-check-label" for="modeDriving">Driving</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="mode" value="foot" id="modeWalking">
                                <label class="form-check-label" for="modeWalking">Walking</label>
                            </div>
                        </div>
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="avoidCrimes">
                            <label class="form-check-label" for="avoidCrimes">Avoid crime</label>
                        </div>
                    </div>
                    <button type="submit" id="getRouteBtn">Get Safe Route</button>
                </div> 
            </div>
        </div>
    </div>

<div id="legend">
    <div class="legend-container">
        <h4 class="legend-title">Safety Level</h4>
        <div class="legend-items">
            <div class="legend-item">
                <span class="color-box" style="background: rgba(17, 255, 0, 0.9);"></span>
                <span class="legend-text">Very Safe</span>
            </div>
            <div class="legend-item">
                <span class="color-box" style="background: rgba(255, 255, 36, 0.94);"></span>
                <span class="legend-text">Safe</span>
            </div>
            <div class="legend-item">
                <span class="color-box" style="background: rgba(255, 172, 39, 1);"></span>
                <span class="legend-text">Moderate</span>
            </div>
            <div class="legend-item">
                <span class="color-box" style="background: rgba(222, 96, 33, 0.9);"></span>
                <span class="legend-text">High Risk</span>
            </div>
            <div class="legend-item">
                <span class="color-box" style="background: rgba(255, 0, 0, 1);"></span>
                <span class="legend-text">Danger</span>
            </div>
        </div>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-container">
        <div class="spinner"></div>
        <h3 class="loading-text">Analyzing Route Safety...</h3>
        <p class="loading-subtext" id="loadingStatus">Fetching route data</p>
    </div>
</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

<script src="routeFunctions.js"></script>   
 <script src="map.js"></script>   
<script src="crimeApiService.js"></script>


</body>
</html>
