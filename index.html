<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeScore</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
</head>
<body>
    
    <!-- Header Section -->
    <div class="input-section">
        <div class="input-group">
            <label for="location">Start Location</label>
            <input type="text" id="location" name="location" placeholder="e.g., New York City">
        <div>   
        <div class="input-group">
            <label for="destination">Destination</label>
            <input type="text" id="destination" name="destination" placeholder="e.g., Central Park">
        </div>
        <div>
            <ul id="suggestions"></ul>
        </div>
        <div>  
            <button id="getRouteBtn" onclick="onButtonClick()">Get Safe Route</button>
        </div>
    </div>






     <div id="map"></div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

<script src="routeFunctions.js"></script>   
 <script src="map.js"></script>   
<script src="crimeApiService.js"></script>


</body>
</html>
<!doctype html>
<html>
<head>
	<title>Police Route Safety Map</title>
	<link href="stylesheet.css" type="text/css" rel="stylesheet"/>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
	<div id="bg-image" class="bg-image"></div>
	<div class= "d-flex mx-auto col-12 col-md-6 col-lg-4 justify-content-center align-items-center vh-100" id="startEnd">
		<script src="passon.js"></script>
		<form id="location-form" onsubmit="passOn(event);">
			<div class="mb-3 input-group">
				<span class="input-group-text">Starting Point</span>
				<input type="text" class="form-control rounded-right" id="startPoint" placeholder="Nottingham Trent University, NG11 8PT" name="startPoint" pattern="[a-z0-9._%+-]+@[a-z0-VT-9.-]+\.[a-z]{2,}$" required>
				<!-- add the suggestions mechanic here-->
			</div>

			<div class="mb-3 input-group">
				<span class="input-group-text">Destination</span>
				<input type="text" class="form-control" id="destPoint" placeholder="London" name="destPoint" required>
				<!-- add the suggestions mechanic here-->
			</div>

			<div class="d-flex justify-content-center align-items-center">
				<button type="submit" class="btn btn-primary mx-auto rounded-corners">Submit</button>
			</div>

		</form> 
	</div>
</body>
</html>
