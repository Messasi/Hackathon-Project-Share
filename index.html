<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeScore</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body id="map">
    
    <!-- Header Section -->
    <div class="input-section">
        <div class="input-group">
            <label for="location">Start Location</label>
            <input type="text" id="location" name="location" placeholder="e.g., New York City">
        <div>   
        <div class="input-group">
            <label for="destination">Destination</label>
            <input type="text" id="destination" name="destination" placeholder="e.g., Central Park">
        </div>
    </div>

        <div class= "d-flex justify-content-center align-items-center vh-100 mx-auto col-12 col-md-6 col-lg-4 vh-100" style="position:fixed; z-index: 1000;"  id="startEnd">
        <div class="bg-body shadow-lg p-5 rounded">
            <form class="" id="location-form" onsubmit="onButtonClick();">
                <div class="mb-3 input-group" style="position:relative;">
                    <span class="input-group-text">Starting Point</span>
                    <input type="text" class="form-control rounded-right" id="startPoint" placeholder="Nottingham Trent University, NG11 8PT" name="startPoint" required>
                    <ul id="startPoint-suggestions" class="suggestions-list"></ul>
                </div>
            </form>
            <form class="" id="location-form" onsubmit="onButtonClick();">
                <div class="mb-3 input-group" style="position:relative;">
                    <span class="input-group-text">Destination</span>
                    <input type="text" class="form-control" id="destPoint" placeholder="London" name="destPoint" required>
                    <ul id="destPoint-suggestions" class="suggestions-list"></ul>
                </div>
            </form>
                <div>  
                    <button id="getRouteBtn" onclick="onButtonClick()">Get Safe Route</button>
                </div> 
        </div>
    </div>








  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

<script src="routeFunctions.js"></script>   
 <script src="map.js"></script>   
<script src="crimeApiService.js"></script>


</body>
</html>
